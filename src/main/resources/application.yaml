spring:
  application:
    name: test

  data:
    redis:
      host: localhost
      port: 6379
      # 연결이 안 될 때 무한정 기다리지 않도록. 학습 중 오타/미기동을 빨리 알아채기 위함.
      connect-timeout: 2s
      timeout: 2s

  # 캐시 저장소로 Redis 를 쓴다.
  # TTL 과 직렬화 방식은 CacheConfig 에서 잡는다. (RedisCacheConfiguration 빈이 있으면
  #  spring.cache.redis.* 프로퍼티는 무시되므로 한쪽에만 적는다)
  cache:
    type: redis

  datasource:
    # 인메모리 H2. 앱을 끄면 데이터도 사라진다.
    # DB_CLOSE_DELAY=-1 이 없으면 커넥션이 모두 닫히는 순간 DB 가 통째로 증발한다.
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:

  h2:
    console:
      enabled: true    # http://localhost:8080/h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop   # 엔티티를 보고 매 기동마다 테이블을 새로 만든다 (학습용)
    open-in-view: false       # 뷰 렌더링까지 영속성 컨텍스트를 열어두지 않는다
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health, caches   # caches: 어떤 캐시가 떠 있는지 확인용
  endpoint:
    health:
      show-details: always   # /actuator/health 에서 redis 항목과 버전까지 보여준다

logging:
  level:
    # 내가 짠 코드가 Redis에 실제로 어떤 명령을 보내는지 보고 싶을 때 DEBUG 로 올린다
    io.lettuce.core: info
    # JPA 가 실제로 날리는 SQL. 캐시가 먹으면 이 로그가 안 찍히는 걸로 히트를 확인한다.
    org.hibernate.SQL: debug
    # 캐시 조회/저장/제거 과정을 한 줄씩 보여준다. 캐시 공부에는 이게 제일 유용하다.
    org.springframework.cache: trace
